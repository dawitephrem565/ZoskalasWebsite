<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport" />
  <title>Zoskales Diamonds — Magazine</title>
  <meta name="description" content="Zoskales Diamonds design magazine — flip through the collection or scan to focus on a design." />
  <meta property="og:title" content="Zoskales Diamonds — Magazine" />
  <meta property="og:description" content="Flip through the Zoskales Diamonds design magazine." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Zoskales Diamonds" />
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch.png" />
  <link
    href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&amp;family=Hanken+Grotesk:ital,wght@0,300..800;1,300..800&amp;display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --ink: #141414;
      --muted: #6b6b6b;
      --line: #e6e2dc;
      --bg: #ffffff;
      --surface: #faf8f5;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: 'Hanken Grotesk', sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    .serif { font-family: 'Bodoni Moda', serif; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      z-index: 30;
      flex: 0 0 auto;
    }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); min-width: 0; }
    .brand img { height: 34px; width: auto; }
    .brand span { font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; white-space: nowrap; }
    .modes { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
    .modes button {
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .modes button.active { background: var(--ink); color: #fff; }
    main { position: relative; flex: 1 1 auto; min-height: 0; }

    /* ---- Zoom (design) view ---- */
    #zoom-view { position: absolute; inset: 0; display: flex; flex-direction: column; }
    #zoom-stage {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      background: var(--surface);
      touch-action: none;
      cursor: grab;
    }
    #zoom-stage.dragging { cursor: grabbing; }
    #zoom-img {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      user-select: none;
      -webkit-user-drag: none;
      will-change: transform;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.18);
      background: #fff;
    }
    #zoom-loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--surface);
      z-index: 5;
    }
    #zoom-loading.hidden, .hidden { display: none !important; }
    .bar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: #fff;
      z-index: 20;
      flex-wrap: wrap;
    }
    .bar button {
      min-width: 44px;
      height: 44px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .bar button:hover { background: var(--surface); }
    .bar button:disabled { opacity: 0.35; cursor: default; }
    .bar button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
    .counter {
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      min-width: 92px;
      text-align: center;
    }

    /* ---- Flip view ---- */
    #flip-view { position: absolute; inset: 0; display: flex; flex-direction: column; }
    #flip-stage {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      padding: 16px;
      overflow: hidden;
    }
    #mag-flip { width: 100%; max-width: 980px; min-height: 420px; }
    #flip-loading, #page-error {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--surface);
      z-index: 5;
    }
    #page-error { color: #b3261e; text-transform: none; letter-spacing: 0.02em; }
    footer {
      flex: 0 0 auto;
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 8px;
      border-top: 1px solid var(--line);
      background: #fff;
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">
      <img src="/logo-mark.png" alt="Zoskales Diamonds" />
      <span class="serif">Magazine</span>
    </a>
    <nav class="modes" aria-label="View mode">
      <button id="mode-zoom" type="button">Design</button>
      <button id="mode-flip" type="button">Full Magazine</button>
    </nav>
  </header>

  <main>
    <section id="zoom-view">
      <div id="zoom-stage">
        <img id="zoom-img" alt="Magazine design" draggable="false" />
        <div id="zoom-loading">Loading design…</div>
      </div>
      <div class="bar">
        <button id="zoom-prev" type="button" aria-label="Previous page">‹</button>
        <span id="zoom-counter" class="counter">– / –</span>
        <button id="zoom-next" type="button" aria-label="Next page">›</button>
        <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
        <button id="zoom-fit" type="button">Fit</button>
        <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
        <button id="zoom-open-flip" type="button" class="primary">View Magazine</button>
      </div>
    </section>

    <section id="flip-view" class="hidden">
      <div id="flip-stage">
        <div id="mag-flip"></div>
        <div id="flip-loading">Opening magazine…</div>
      </div>
      <div class="bar">
        <button id="flip-prev" type="button" aria-label="Previous page">‹</button>
        <span id="flip-counter" class="counter">– / –</span>
        <button id="flip-next" type="button" aria-label="Next page">›</button>
        <button id="flip-open-zoom" type="button" class="primary">Focus on Design</button>
      </div>
    </section>

    <div id="page-error" class="hidden"></div>
  </main>

  <footer>Zoskales Diamonds · Addis Ababa</footer>

  <script type="module">
    import { PageFlip } from 'page-flip';

    (() => {
      const TOTAL = 21;
      const pageSrc = (n) => `/magazine/pages/page-${String(n).padStart(2, '0')}.jpg`;

      const params = new URLSearchParams(location.search);
      let pageNum = Math.max(1, Math.min(TOTAL, parseInt(params.get('page'), 10) || 1));
      const startZoomed = params.get('zoom') === '1' || params.get('zoom') === 'design';

      const $ = (id) => document.getElementById(id);
      const els = {
        zoomView: $('zoom-view'), flipView: $('flip-view'),
        stage: $('zoom-stage'), img: $('zoom-img'), zoomLoading: $('zoom-loading'),
        zoomCounter: $('zoom-counter'), zoomPrev: $('zoom-prev'), zoomNext: $('zoom-next'),
        flipEl: $('mag-flip'), flipLoading: $('flip-loading'),
        flipCounter: $('flip-counter'), flipPrev: $('flip-prev'), flipNext: $('flip-next'),
        error: $('page-error'),
        modeZoom: $('mode-zoom'), modeFlip: $('mode-flip'),
      };

      const fail = (msg) => {
        els.error.textContent = msg;
        els.error.classList.remove('hidden');
        els.zoomLoading.classList.add('hidden');
        els.flipLoading.classList.add('hidden');
      };

      const waitImage = (src) => new Promise((res, rej) => {
        const im = new Image();
        im.onload = () => res(im);
        im.onerror = () => rej(new Error('Could not load ' + src));
        im.src = src;
      });

      /* ---------------- zoom view ---------------- */
      let natW = 0, natH = 0, s = 1, tx = 0, ty = 0, fitS = 1, mode = 'fit';
      let zoomToken = 0;

      const clampPan = () => {
        const sw = els.stage.clientWidth, sh = els.stage.clientHeight;
        const w = natW * s, h = natH * s;
        if (w <= sw) tx = (sw - w) / 2;
        else tx = Math.min(40, Math.max(sw - w - 40, tx));
        if (h <= sh) ty = (sh - h) / 2;
        else ty = Math.min(40, Math.max(sh - h - 40, ty));
      };
      const apply = () => {
        els.img.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
      };
      const doFit = () => {
        if (!natW) return;
        const sw = els.stage.clientWidth, sh = els.stage.clientHeight;
        fitS = Math.min(sw / natW, sh / natH);
        s = fitS;
        mode = 'fit';
        tx = (sw - natW * s) / 2;
        ty = (sh - natH * s) / 2;
        apply();
      };
      const doFocus = () => {
        if (!natW) return;
        const sw = els.stage.clientWidth, sh = els.stage.clientHeight;
        fitS = Math.min(sw / natW, sh / natH);
        s = fitS * 2;
        mode = 'focus';
        tx = (sw - natW * s) / 2;
        ty = (sh - natH * s) / 2;
        apply();
      };
      const zoomBy = (f) => {
        if (!natW) return;
        const sw = els.stage.clientWidth, sh = els.stage.clientHeight;
        const ns = Math.min(Math.max(s * f, fitS * 0.6), fitS * 8);
        const r = ns / s;
        tx = sw / 2 - (sw / 2 - tx) * r;
        ty = sh / 2 - (sh / 2 - ty) * r;
        s = ns;
        mode = 'custom';
        clampPan();
        apply();
      };

      async function renderZoomPage(n) {
        const token = ++zoomToken;
        els.zoomLoading.classList.remove('hidden');
        els.zoomLoading.textContent = `Loading page ${n}…`;
        const src = pageSrc(n);
        try {
          if (els.img.src.endsWith(src) && els.img.complete && els.img.naturalWidth) {
            natW = els.img.naturalWidth;
            natH = els.img.naturalHeight;
          } else {
            await new Promise((res, rej) => {
              els.img.onload = () => res();
              els.img.onerror = () => rej(new Error('image error'));
              els.img.src = src;
              if (els.img.complete && els.img.naturalWidth) res();
            });
            if (token !== zoomToken) return;
            natW = els.img.naturalWidth;
            natH = els.img.naturalHeight;
          }
          if (token !== zoomToken) return;
          els.zoomLoading.classList.add('hidden');
          if (mode === 'focus') doFocus(); else doFit();
          syncZoomBar();
        } catch (err) {
          if (token === zoomToken) fail('Could not load page ' + n + '.');
        }
      }

      const syncZoomBar = () => {
        els.zoomCounter.textContent = `${pageNum} / ${TOTAL}`;
        els.zoomPrev.disabled = pageNum <= 1;
        els.zoomNext.disabled = pageNum >= TOTAL;
      };

      const gotoZoomPage = (n) => {
        const nn = Math.min(Math.max(1, n), TOTAL);
        if (nn === pageNum && els.img.src) return;
        pageNum = nn;
        syncZoomBar();
        renderZoomPage(pageNum);
      };

      /* pan + pinch */
      const pointers = new Map();
      let pinchDist = 0, pinchMid = null;
      els.stage.addEventListener('pointerdown', (e) => {
        els.stage.setPointerCapture(e.pointerId);
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        els.stage.classList.add('dragging');
        if (pointers.size === 2) {
          const [a, b] = [...pointers.values()];
          pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
          pinchMid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
        }
      });
      els.stage.addEventListener('pointermove', (e) => {
        if (!pointers.has(e.pointerId)) return;
        const prev = pointers.get(e.pointerId);
        const cur = { x: e.clientX, y: e.clientY };
        pointers.set(e.pointerId, cur);
        if (pointers.size === 1) {
          tx += cur.x - prev.x;
          ty += cur.y - prev.y;
          mode = 'custom';
          clampPan();
          apply();
        } else if (pointers.size === 2 && pinchDist) {
          const [a, b] = [...pointers.values()];
          const d = Math.hypot(a.x - b.x, a.y - b.y);
          const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
          if (pinchDist > 0) {
            const r = d / pinchDist;
            const ns = Math.min(Math.max(s * r, fitS * 0.6), fitS * 8);
            const sr = ns / s;
            const rect = els.stage.getBoundingClientRect();
            const cx = mid.x - rect.left, cy = mid.y - rect.top;
            tx = cx - (cx - tx) * sr;
            ty = cy - (cy - ty) * sr;
            s = ns;
            clampPan();
            apply();
          }
          if (pinchMid) { tx += mid.x - pinchMid.x; ty += mid.y - pinchMid.y; }
          pinchDist = d;
          pinchMid = mid;
          mode = 'custom';
        }
      });
      const releasePointer = (e) => {
        pointers.delete(e.pointerId);
        if (pointers.size < 2) { pinchDist = 0; pinchMid = null; }
        if (pointers.size === 0) els.stage.classList.remove('dragging');
      };
      els.stage.addEventListener('pointerup', releasePointer);
      els.stage.addEventListener('pointercancel', releasePointer);
      els.stage.addEventListener('wheel', (e) => {
        e.preventDefault();
        zoomBy(e.deltaY < 0 ? 1.12 : 1 / 1.12);
      }, { passive: false });
      els.stage.addEventListener('dblclick', () => (mode === 'fit' ? doFocus() : doFit()));

      $('zoom-in').addEventListener('click', () => zoomBy(1.3));
      $('zoom-out').addEventListener('click', () => zoomBy(1 / 1.3));
      $('zoom-fit').addEventListener('click', doFit);
      els.zoomPrev.addEventListener('click', () => gotoZoomPage(pageNum - 1));
      els.zoomNext.addEventListener('click', () => gotoZoomPage(pageNum + 1));

      /* ---------------- flip view ---------------- */
      let flip = null;
      let flipToken = 0;

      async function ensureFlip() {
        if (flip) return flip;
        const token = ++flipToken;
        els.flipLoading.classList.remove('hidden');
        try {
          for (const n of [1, 2]) {
            if (n > TOTAL) continue;
            if (token !== flipToken) return null;
            els.flipLoading.textContent = `Loading page ${n} of ${TOTAL}…`;
            await waitImage(pageSrc(n));
          }
          if (token !== flipToken || !document.getElementById('mag-flip')) return null;
          els.flipEl.innerHTML = Array.from({ length: TOTAL }, (_, i) => {
            const n = i + 1;
            return `<div style="background:#fff;"><img src="${pageSrc(n)}" alt="Magazine page ${n}" style="width:100%;height:100%;object-fit:contain;display:block;"/></div>`;
          }).join('');
          els.flipLoading.classList.add('hidden');
          flip = new PageFlip(els.flipEl, {
            width: 400,
            height: 566,
            size: 'stretch',
            minWidth: 260,
            maxWidth: 980,
            minHeight: 368,
            maxHeight: 1400,
            drawShadow: true,
            flippingTime: 800,
            showCover: true,
            usePortrait: true,
            mobileScrollSupport: false,
          });
          flip.loadFromHTML(els.flipEl.querySelectorAll('div'));
          const startIdx = Math.min(pageNum - 1, flip.getPageCount() - 1);
          flip.turnToPage(Math.max(0, startIdx));
          const sync = () => {
            const idx = flip.getCurrentPageIndex();
            pageNum = idx + 1;
            els.flipCounter.textContent = `${idx + 1} / ${flip.getPageCount()}`;
            els.flipPrev.disabled = idx <= 0;
            els.flipNext.disabled = idx >= flip.getPageCount() - 1;
            syncZoomBar();
          };
          flip.on('flip', sync);
          sync();
          els.flipPrev.onclick = () => flip.flipPrev();
          els.flipNext.onclick = () => flip.flipNext();
          return flip;
        } catch (err) {
          if (token === flipToken) fail('Could not load the magazine: ' + (err && err.message ? err.message : err));
          return null;
        }
      }

      /* ---------------- modes ---------------- */
      function showZoom() {
        els.zoomView.classList.remove('hidden');
        els.flipView.classList.add('hidden');
        els.modeZoom.classList.add('active');
        els.modeFlip.classList.remove('active');
        if (els.img.src) { syncZoomBar(); requestAnimationFrame(() => (mode === 'focus' ? doFocus() : doFit())); }
        else renderZoomPage(pageNum);
      }
      async function showFlip() {
        els.flipView.classList.remove('hidden');
        els.zoomView.classList.add('hidden');
        els.modeFlip.classList.add('active');
        els.modeZoom.classList.remove('active');
        await ensureFlip();
      }

      els.modeZoom.addEventListener('click', showZoom);
      els.modeFlip.addEventListener('click', showFlip);
      $('zoom-open-flip').addEventListener('click', showFlip);
      $('flip-open-zoom').addEventListener('click', showZoom);

      document.addEventListener('keydown', (e) => {
        if (['INPUT', 'TEXTAREA', 'SELECT'].includes((document.activeElement || {}).tagName)) return;
        const zoomVisible = !els.zoomView.classList.contains('hidden');
        if (zoomVisible) {
          if (e.key === 'ArrowRight') gotoZoomPage(pageNum + 1);
          if (e.key === 'ArrowLeft') gotoZoomPage(pageNum - 1);
        } else if (flip) {
          if (e.key === 'ArrowRight') flip.flipNext();
          if (e.key === 'ArrowLeft') flip.flipPrev();
        }
      });

      window.addEventListener('resize', () => {
        if (!els.zoomView.classList.contains('hidden') && natW) {
          if (mode === 'fit') doFit();
          else if (mode === 'focus') doFocus();
          else { clampPan(); apply(); }
        }
      });

      syncZoomBar();
      if (startZoomed) showZoom();
      else showFlip();
    })();
  </script>
</body>
</html>
