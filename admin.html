<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Zoskales Admin</title>
<link rel="icon" href="/favicon.png" type="image/png"/><link rel="apple-touch-icon" href="/apple-touch.png"/>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Hanken+Grotesk:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link rel="stylesheet" href="/src/css/main.css"/>
<style>
@keyframes spin { to { transform: rotate(360deg); } }
.spin { animation: spin 1s linear infinite; }
@keyframes fadeUp { from { opacity:0; transform: translateY(12px);} to {opacity:1; transform:translateY(0);} }
.fade-up { animation: fadeUp .35s ease both; }
body { font-family: 'Hanken Grotesk', sans-serif; }
.serif { font-family: 'Bodoni Moda', serif; }
.nav-item.active { background:#000; color:#fff; }
.material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
</head>
<body class="bg-surface text-on-surface">
<div class="flex min-h-screen">

  <!-- Sidebar -->
  <aside class="w-64 bg-surface-container-lowest border-r border-surface-container-high flex flex-col fixed inset-y-0">
    <div class="p-6 border-b border-surface-container-high">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-white rounded-lg flex items-center justify-center overflow-hidden shrink-0 border border-surface-container-high"><img src="/logo-mark.png" alt="Zoskales Diamonds" class="w-8 h-8 object-contain" /></div>
        <div>
          <div class="serif text-lg leading-none">Zoskales</div>
          <div class="text-[10px] uppercase tracking-[0.2em] text-secondary">Admin Panel</div>
        </div>
      </div>
    </div>
    <nav class="flex-1 p-4 space-y-1" id="side-nav">
      <button data-page="dashboard" class="nav-item active w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm transition-all hover:bg-surface-container">
        <span class="material-symbols-outlined text-xl">dashboard</span> Dashboard
      </button>
      <button data-page="membership" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm transition-all hover:bg-surface-container relative">
        <span class="material-symbols-outlined text-xl">workspace_premium</span> Membership
        <span id="pending-badge" class="hidden ml-auto bg-secondary text-white text-[10px] px-2 py-0.5 rounded-full"></span>
      </button>
      <button data-page="bookings" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm transition-all hover:bg-surface-container relative">
        <span class="material-symbols-outlined text-xl">event_seat</span> Bookings
        <span id="bookings-badge" class="hidden ml-auto bg-secondary text-white text-[10px] px-2 py-0.5 rounded-full"></span>
      </button>
      <button data-page="images" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm transition-all hover:bg-surface-container">
        <span class="material-symbols-outlined text-xl">image</span> Images
      </button>
      <button data-page="content" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm transition-all hover:bg-surface-container">
        <span class="material-symbols-outlined text-xl">edit_note</span> Website Content
      </button>
      <button data-page="vcard" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm transition-all hover:bg-surface-container">
        <span class="material-symbols-outlined text-xl">contact_page</span> Virtual Card
      </button>
    </nav>
    <div class="p-4 border-t border-surface-container-high">
      <a href="/" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm hover:bg-surface-container transition-all">
        <span class="material-symbols-outlined text-xl">arrow_back</span> Back to Website
      </a>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 ml-64 p-8">
    <header class="mb-8 flex items-center justify-between">
      <div>
        <h1 id="page-title" class="serif text-3xl">Dashboard</h1>
        <p id="page-sub" class="text-sm text-on-surface-variant">Overview of Zoskales premium membership</p>
      </div>
      <div id="header-action"></div>
    </header>
    <div id="page-content"></div>
  </main>
</div>

<!-- Accept Modal -->
<div id="accept-modal" class="hidden fixed inset-0 z-50 items-center justify-center bg-black/60 p-4">
  <div class="bg-surface rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 fade-up">
    <div class="flex items-center justify-between mb-5">
      <h3 class="serif text-xl">Approve Membership</h3>
      <button onclick="closeAccept()" class="p-2 hover:bg-surface-container rounded-full"><span class="material-symbols-outlined">close</span></button>
    </div>
    <p class="text-sm text-on-surface-variant mb-4">Phone: <strong id="accept-phone"></strong></p>
    <p class="text-xs uppercase tracking-widest text-on-surface-variant mb-2">Select images for this member</p>
    <div id="accept-images" class="grid grid-cols-3 gap-3 mb-5 max-h-64 overflow-y-auto"></div>
    <label class="text-xs uppercase tracking-widest text-on-surface-variant">Availability (hours)</label>
    <select id="accept-duration" class="w-full mt-1 mb-5 px-4 py-3 rounded-xl border border-outline-variant bg-white text-sm">
      <option value="1">1 hour</option>
      <option value="2">2 hours</option>
      <option value="3">3 hours</option>
      <option value="6">6 hours</option>
      <option value="12">12 hours</option>
      <option value="24">24 hours (1 day)</option>
      <option value="72">3 days</option>
      <option value="168">7 days</option>
    </select>
    <div class="flex gap-3">
      <button onclick="closeAccept()" class="flex-1 py-3 rounded-full border border-outline text-sm">Cancel</button>
      <button onclick="confirmAccept()" id="confirm-accept-btn" class="flex-1 py-3 rounded-full bg-primary text-white text-sm">Publish &amp; Approve</button>
    </div>
    <div id="accept-result" class="hidden mt-4 p-4 rounded-xl bg-secondary-container text-sm">
      Approved! One-time code: <strong id="shown-otp" class="text-lg tracking-[0.3em]"></strong>
    </div>
  </div>
</div>

<script>
const API = '/api/admin';
let currentPage = 'dashboard';
let acceptUserId = null;
let adminImages = [];
let adminImageCats = {};
const IMG_CATEGORIES = [
  ['engagement', 'Engagement Rings'],
  ['wedding', 'Wedding'],
  ['necklaces', 'Necklaces & Pendants'],
  ['earrings', 'Earrings'],
  ['bracelets', 'Bracelets'],
  ['rings', 'Rings'],
  ['beads', 'Beads'],
  ['mens', "Men's Collection"],
];

document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentPage = btn.dataset.page;
    render();
  });
});

async function api(path, opts = {}) {
  const r = await fetch(API + path, {
    method: opts.method || 'GET',
    headers: { 'Content-Type': 'application/json' },
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'Request failed');
  return data;
}

async function compressToBase64(file, maxDim = 1600, quality = 0.85) {
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, maxDim / Math.max(bitmap.width, bitmap.height));
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(bitmap.width * scale));
  canvas.height = Math.max(1, Math.round(bitmap.height * scale));
  canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/jpeg', quality).split(',')[1];
}

function setTitle(t, s) {
  document.getElementById('page-title').textContent = t;
  document.getElementById('page-sub').textContent = s;
}

async function render() {
  const c = document.getElementById('page-content');
  document.getElementById('header-action').innerHTML = '';
  if (currentPage === 'dashboard') return renderDashboard(c);
  if (currentPage === 'membership') return renderMembership(c);
  if (currentPage === 'bookings') return renderBookings(c);
  if (currentPage === 'images') return renderImages(c);
  if (currentPage === 'content') return renderContent(c);
  if (currentPage === 'vcard') return renderVcard(c);
}

async function renderDashboard(c) {
  setTitle('Dashboard', 'Overview of Zoskales premium membership');
  const s = await api('/stats');
  c.innerHTML = `
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-5 fade-up">
      ${statCard('Pending Requests', s.pending, 'hourglass_top', 'bg-secondary-container text-on-secondary-container')}
      ${statCard('Approved Members', s.approved, 'verified', 'bg-surface-container-high')}
      ${statCard('Total Images', s.images, 'image', 'bg-surface-container-high')}
      ${statCard('Private Images', s.privateCount, 'lock', 'bg-error-container text-on-error-container')}
    </div>
    <div class="mt-8 p-6 rounded-2xl bg-surface-container-lowest shadow-sm fade-up">
      <h3 class="serif text-xl mb-2">Quick Actions</h3>
      <p class="text-sm text-on-surface-variant mb-4">Manage membership approvals and premium content.</p>
      <div class="flex gap-3">
        <button onclick="goTo('membership')" class="px-5 py-3 rounded-full bg-primary text-white text-sm">Review Membership</button>
        <button onclick="goTo('images')" class="px-5 py-3 rounded-full border border-outline text-sm">Upload Images</button>
      </div>
    </div>`;
}

function statCard(label, val, icon, cls) {
  return `<div class="p-5 rounded-2xl bg-surface-container-lowest shadow-sm ${cls}">
    <span class="material-symbols-outlined text-3xl">${icon}</span>
    <div class="text-3xl font-bold mt-2">${val}</div>
    <div class="text-xs uppercase tracking-widest opacity-70">${label}</div>
  </div>`;
}

function goTo(page) {
  document.querySelector(`.nav-item[data-page="${page}"]`).click();
}

async function renderMembership(c) {
  setTitle('Membership Requests', 'Approve or decline member access requests');
  c.innerHTML = '<div class="text-center py-12"><span class="material-symbols-outlined text-4xl spin">progress_activity</span></div>';
  const { requests } = await api('/requests');
  const pending = requests.filter(r => r.status === 'pending').length;
  const badge = document.getElementById('pending-badge');
  badge.textContent = pending;
  badge.classList.toggle('hidden', pending === 0);

  if (!requests.length) {
    c.innerHTML = '<div class="text-center py-12 text-on-surface-variant">No membership requests yet.</div>';
    return;
  }

  c.innerHTML = `<div class="space-y-4 fade-up">${requests.map(r => `
    <div class="p-5 rounded-2xl bg-surface-container-lowest shadow-sm flex flex-wrap items-center gap-4">
      <div class="w-11 h-11 rounded-full ${r.status==='pending'?'bg-secondary-container text-on-secondary-container':r.status==='approved'?'bg-surface-container-high':'bg-error-container text-on-error-container'} flex items-center justify-center">
        <span class="material-symbols-outlined">${r.status==='pending'?'hourglass_top':r.status==='approved'?'verified':'block'}</span>
      </div>
      <div class="flex-1 min-w-[180px]">
        <div class="font-medium">${escapeHtml(r.phone)}</div>
        <div class="text-xs text-on-surface-variant capitalize">${r.status} · ${new Date(r.created_at * 1000).toLocaleString()}</div>
        ${r.otp_code ? `<div class="text-xs mt-1">Active code: <strong class="tracking-[0.2em]">${r.otp_code}</strong></div>` : ''}
        ${r.image_urls ? `<div class="text-xs text-secondary mt-1">${r.image_urls.split(',').length} image(s) assigned</div>` : ''}
      </div>
      <div class="flex gap-2">
        ${r.status === 'pending' ? `
          <button onclick="openAccept(${r.id}, '${escapeHtml(r.phone)}')" class="px-5 py-2.5 rounded-full bg-primary text-white text-xs uppercase tracking-widest">Accept</button>
          <button onclick="declineReq(${r.id})" class="px-5 py-2.5 rounded-full border border-error text-error text-xs uppercase tracking-widest">Decline</button>
        ` : `<span class="text-xs px-3 py-1 rounded-full ${r.status==='approved'?'bg-surface-container-high':'bg-error-container text-on-error-container'} capitalize">${r.status}</span>`}
      </div>
    </div>`).join('')}</div>`;
}

async function renderBookings(c) {
  setTitle('Consultation Bookings', 'Clients who filled the Book a Private Consultation form');
  c.innerHTML = '<div class="text-center py-12"><span class="material-symbols-outlined text-4xl spin">progress_activity</span></div>';
  const { bookings } = await api('/bookings');

  const badge = document.getElementById('bookings-badge');
  const newCount = bookings.filter(b => b.status === 'new').length;
  badge.textContent = newCount;
  badge.classList.toggle('hidden', newCount === 0);

  if (!bookings.length) {
    c.innerHTML = '<div class="text-center py-12 text-on-surface-variant">No consultation bookings yet.</div>';
    return;
  }

  const statusChip = (s) =>
    s === 'new' ? '<span class="text-[10px] px-2 py-1 rounded-full bg-secondary-container text-on-secondary-container uppercase tracking-widest">New</span>' :
    s === 'contacted' ? '<span class="text-[10px] px-2 py-1 rounded-full bg-surface-container-high uppercase tracking-widest">Contacted</span>' :
    '<span class="text-[10px] px-2 py-1 rounded-full bg-surface-container-highest uppercase tracking-widest">Closed</span>';

  c.innerHTML = `<div class="space-y-4 fade-up">${bookings.map(b => `
    <div class="p-5 rounded-2xl bg-surface-container-lowest shadow-sm">
      <div class="flex flex-wrap items-start gap-4">
        <div class="w-11 h-11 rounded-full bg-surface-container-high flex items-center justify-center font-medium">${escapeHtml((b.name || '?').charAt(0).toUpperCase())}</div>
        <div class="flex-1 min-w-[220px]">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="font-medium">${escapeHtml(b.name)}</span>
            ${statusChip(b.status)}
            <span class="text-xs text-on-surface-variant">${new Date(b.created_at * 1000).toLocaleString()}</span>
          </div>
          <div class="text-sm text-on-surface-variant mt-1">${escapeHtml(b.consult_type || '')}</div>
          <div class="flex flex-wrap gap-x-5 gap-y-1 text-sm mt-2">
            <span class="flex items-center gap-1"><span class="material-symbols-outlined text-base">mail</span>${escapeHtml(b.email)}</span>
            ${b.phone ? `<span class="flex items-center gap-1"><span class="material-symbols-outlined text-base">phone</span>${escapeHtml(b.phone)}</span>` : ''}
            ${b.preferred_date ? `<span class="flex items-center gap-1"><span class="material-symbols-outlined text-base">calendar_month</span>${escapeHtml(b.preferred_date)}</span>` : ''}
          </div>
          <div class="text-xs text-on-surface-variant mt-1 flex items-center gap-1"><span class="material-symbols-outlined text-base">storefront</span>${escapeHtml(b.showroom || '')}</div>
          ${b.message ? `<div class="mt-3 p-3 rounded-xl bg-surface-container text-sm">${escapeHtml(b.message)}</div>` : ''}
        </div>
        <div class="flex flex-col gap-2">
          ${b.phone ? `
          <a href="tel:${escapeHtml(String(b.phone).replace(/[^\d+]/g, ''))}"
             class="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-full bg-primary text-white text-xs uppercase tracking-widest hover:bg-secondary transition-colors">
            <span class="material-symbols-outlined text-sm">call</span> Call
          </a>` : `
          <a href="mailto:${escapeHtml(b.email)}"
             class="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-full bg-primary text-white text-xs uppercase tracking-widest hover:bg-secondary transition-colors">
            <span class="material-symbols-outlined text-sm">mail</span> Email
          </a>`}
          <select onchange="setBookingStatus(${b.id}, this.value)" class="px-4 py-2.5 rounded-full border border-outline-variant bg-white text-xs text-center cursor-pointer">
            <option value="new" ${b.status==='new'?'selected':''}>New</option>
            <option value="contacted" ${b.status==='contacted'?'selected':''}>Contacted</option>
            <option value="closed" ${b.status==='closed'?'selected':''}>Closed</option>
          </select>
        </div>
      </div>
    </div>`).join('')}</div>`;
}

window.setBookingStatus = async function(id, status) {
  try {
    await api('/bookings', { method: 'PATCH', body: { id, status } });
  } catch (e) { alert(e.message); }
};

window.declineReq = async function(id) {
  if (!confirm('Decline this membership request?')) return;
  await api(`/requests/${id}/decline`, { method: 'POST' });
  render();
};

window.openAccept = async function(id, phone) {
  acceptUserId = id;
  document.getElementById('accept-phone').textContent = phone;
  document.getElementById('accept-result').classList.add('hidden');
  document.getElementById('confirm-accept-btn').disabled = false;
  document.getElementById('accept-modal').classList.remove('hidden');
  document.getElementById('accept-modal').classList.add('flex');

  const box = document.getElementById('accept-images');
  box.innerHTML = '<div class="col-span-3 text-center py-6"><span class="material-symbols-outlined spin">progress_activity</span></div>';
  const { images } = await api('/images');
  adminImages = images;
  if (!images.length) {
    box.innerHTML = '<div class="col-span-3 text-sm text-on-surface-variant py-4">No images uploaded yet. Go to Images to upload first.</div>';
    return;
  }
  box.innerHTML = images.map(img => `
    <label class="relative rounded-xl overflow-hidden cursor-pointer border-2 border-transparent has-[:checked]:border-secondary" style="aspect-ratio:1">
      <input type="checkbox" class="absolute top-2 right-2 z-10 w-5 h-5 accent-black" value="${img.id}" />
      <img src="${img.url}" class="w-full h-full object-cover" alt="" />
      <span class="absolute bottom-1 left-1 text-[9px] px-1.5 py-0.5 rounded ${img.visibility==='private'?'bg-black/70 text-white':'bg-white/90 text-black'}">${img.visibility}</span>
    </label>`).join('');
};

window.closeAccept = function() {
  document.getElementById('accept-modal').classList.add('hidden');
  document.getElementById('accept-modal').classList.remove('flex');
};

window.confirmAccept = async function() {
  const selected = [...document.querySelectorAll('#accept-images input:checked')].map(i => Number(i.value));
  const durationHours = Number(document.getElementById('accept-duration').value);
  const btn = document.getElementById('confirm-accept-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="material-symbols-outlined spin text-sm">progress_activity</span> Publishing…';
  try {
    const res = await api(`/requests/${acceptUserId}/accept`, { method: 'POST', body: { imageIds: selected, durationHours } });
    document.getElementById('shown-otp').textContent = res.otp;
    document.getElementById('accept-result').classList.remove('hidden');
    btn.textContent = 'Published ✓';
    setTimeout(() => { closeAccept(); render(); }, 3500);
  } catch (e) {
    alert(e.message);
    btn.disabled = false;
    btn.textContent = 'Publish & Approve';
  }
};

async function renderImages(c) {
  setTitle('Images', 'Upload and manage public / private gallery images');
  document.getElementById('header-action').innerHTML = `
    <label class="inline-flex items-center gap-2 px-5 py-3 rounded-full bg-primary text-white text-sm cursor-pointer">
      <span class="material-symbols-outlined text-lg">upload</span> Upload Images
      <input type="file" id="img-file" accept="image/*" multiple class="hidden" />
    </label>`;
  c.innerHTML = `
    <div id="upload-progress" class="hidden mb-6 p-4 rounded-2xl bg-surface-container-lowest shadow-sm">
      <div class="flex items-center justify-between mb-2">
        <div id="up-status" class="text-sm font-medium">Uploading…</div>
        <div id="up-detail" class="text-xs text-on-surface-variant"></div>
      </div>
      <div class="h-2 rounded-full bg-surface-container overflow-hidden">
        <div id="up-bar" class="h-full bg-primary transition-all duration-300" style="width:0%"></div>
      </div>
      <div id="up-files" class="mt-3 space-y-1 max-h-44 overflow-y-auto text-xs"></div>
    </div>
    <div id="images-area"></div>`;
  const { images } = await api('/images');
  adminImages = images;
  await loadImageCats();
  renderImagesArea();

  document.getElementById('img-file').onchange = async (e) => {
    const selected = Array.from(e.target.files || []);
    e.target.value = '';
    if (!selected.length) return;
    if (bulkUploadBusy) return;
    let note = '';
    let files = selected;
    if (selected.length > 50) {
      files = selected.slice(0, 50);
      note = `Limit is 50 images per upload — sending the first 50 (you selected ${selected.length}).`;
    }
    await bulkUpload(files, note);
  };
}

function renderImagesArea() {
  const el = document.getElementById('images-area');
  if (!el) return;
  if (!adminImages.length) {
    el.innerHTML = '<div class="text-center py-12 text-on-surface-variant">No images yet. Click "Upload Images" to add your first.</div>';
    return;
  }
  el.innerHTML = `<div id="images-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4 fade-up">${adminImages.map(imageCardHtml).join('')}</div>`;
}

async function loadImageCats() {
  try {
    const { content } = await api('/content');
    adminImageCats = {};
    (content || []).filter(r => r.section === 'image_cat').forEach(r => { adminImageCats[String(r.key)] = r.value || ''; });
  } catch (err) {
    console.error('Load image categories failed:', err);
  }
}

function imgCatLabel(id) {
  const cid = adminImageCats[String(id)] || '';
  const found = IMG_CATEGORIES.find(c => c[0] === cid);
  return found ? found[1] : '';
}

function imageCardHtml(img) {
  const catLabel = imgCatLabel(img.id);
  return `
    <div id="img-card-${img.id}" class="relative group rounded-xl overflow-hidden bg-surface-container-lowest shadow-sm" style="aspect-ratio:1">
      <img src="${img.url}" class="w-full h-full object-cover" alt="" />
      <span id="img-vis-${img.id}" class="absolute top-2 left-2 text-[9px] px-2 py-0.5 rounded-full ${img.visibility === 'private' ? 'bg-black/80 text-white' : 'bg-white/95 text-black'}">${img.visibility}</span>
      <button onclick="editImage(${img.id})" title="Edit" class="absolute top-2 right-9 opacity-0 group-hover:opacity-100 transition-opacity w-7 h-7 rounded-full bg-white/90 flex items-center justify-center shadow">
        <span class="material-symbols-outlined text-sm">edit</span>
      </button>
      <button onclick="deleteImage(${img.id})" title="Delete" class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition-opacity w-7 h-7 rounded-full bg-white/90 flex items-center justify-center shadow">
        <span class="material-symbols-outlined text-sm">delete</span>
      </button>
      <div class="absolute bottom-0 inset-x-0 p-2 bg-gradient-to-t from-black/70 to-transparent">
        ${catLabel ? `<div class="text-[9px] uppercase tracking-widest text-secondary-fixed truncate">${escapeHtml(catLabel)}</div>` : ''}
        <div class="text-[10px] text-white truncate">${escapeHtml(img.title || '')}</div>
      </div>
    </div>`;
}

let bulkUploadBusy = false;

async function bulkUpload(files, note) {
  bulkUploadBusy = true;
  const panel = document.getElementById('upload-progress');
  const bar = document.getElementById('up-bar');
  const status = document.getElementById('up-status');
  const detail = document.getElementById('up-detail');
  const list = document.getElementById('up-files');
  panel.classList.remove('hidden');
  bar.style.width = '0%';
  status.textContent = `Uploading 1 of ${files.length}…`;
  detail.className = 'text-xs text-on-surface-variant';
  detail.textContent = note || '';
  list.innerHTML = '';
  const rowIds = files.map((f, i) => {
    const rowId = `upf-${i}`;
    list.insertAdjacentHTML('beforeend',
      `<div id="${rowId}" class="flex items-center gap-2"><span class="material-symbols-outlined text-sm text-on-surface-variant">radio_button_unchecked</span><span class="flex-1 truncate">${escapeHtml(f.name)}</span><span class="text-on-surface-variant">waiting</span></div>`);
    return rowId;
  });
  let saved = 0, failed = 0;
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    const row = document.getElementById(rowIds[i]);
    status.textContent = `Uploading ${i + 1} of ${files.length}…`;
    row.innerHTML = `<span class="material-symbols-outlined text-sm text-primary spin">progress_activity</span><span class="flex-1 truncate">${escapeHtml(f.name)}</span><span class="text-on-surface-variant">uploading…</span>`;
    try {
      const fileBase64 = await compressToBase64(f, 1600, 0.85);
      const res = await api('/images', { method: 'POST', body: { title: f.name, visibility: 'private', fileBase64 } });
      saved++;
      const img = { id: res.id, title: res.title || f.name, url: res.url, visibility: res.visibility || 'private' };
      adminImages.unshift(img);
      const grid = document.getElementById('images-grid');
      if (grid) grid.insertAdjacentHTML('afterbegin', imageCardHtml(img));
      else renderImagesArea();
      row.innerHTML = `<span class="material-symbols-outlined text-sm text-green-600">check_circle</span><span class="flex-1 truncate">${escapeHtml(f.name)}</span><span class="text-green-600">saved</span>`;
    } catch (err) {
      failed++;
      row.innerHTML = `<span class="material-symbols-outlined text-sm text-red-600">error</span><span class="flex-1 truncate">${escapeHtml(f.name)}</span><span class="text-red-600">failed</span>`;
      detail.className = 'text-xs text-red-600';
      detail.textContent = `${f.name}: ${err.message}`;
    }
    bar.style.width = `${Math.round(((i + 1) / files.length) * 100)}%`;
  }
  status.textContent = failed
    ? `Done — ${saved} saved, ${failed} failed`
    : `Done — ${saved} image${saved === 1 ? '' : 's'} uploaded (private)`;
  bulkUploadBusy = false;
  if (!failed) setTimeout(() => { if (!bulkUploadBusy) panel.classList.add('hidden'); }, 4000);
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

];

function vcNormUrl(u) {
  const s = String(u || '').trim();
  if (!s) return '';
  return /^https?:\/\//i.test(s) ? s : 'https://' + s;
}

function vcSocialUrl(key, u) {
  let s = String(u || '').trim();
  if (!s) return '';
  if (s.startsWith('@')) s = key === 'tiktok' ? `tiktok.com/${s}` : s.slice(1);
  if (!/^https?:\/\//i.test(s) && !s.includes('.')) s = `${key}.com/${s}`;
  return vcNormUrl(s);
}

async function vcMakeQr(text, width = 240) {
  if (window.QRCode) return window.QRCode.toDataURL(text, { margin: 1, width });
  await new Promise((res) => document.addEventListener('qr-ready', res, { once: true }));
  return window.QRCode.toDataURL(text, { margin: 1, width });
}

function vcRR(ctx, x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

async function vcDownloadCard() {
  const btn = document.getElementById('vc-download');
  if (!btn || btn.disabled) return;
  btn.disabled = true;
  btn.textContent = 'Preparing…';
  try {
    const d = readVcardForm();
    const vcUrl = location.origin + '/api/vcard';
    if (!window.buildVcardText) await new Promise((res) => document.addEventListener('qr-ready', res, { once: true }));
    try {
      await Promise.all([
        document.fonts.load('600 36px "Bodoni Moda"', 'A'),
        document.fonts.load('400 15px "Hanken Grotesk"', 'A'),
        document.fonts.load('600 12px "Hanken Grotesk"', 'A'),
        document.fonts.load('400 18px "Material Symbols Outlined"', 'call'),
      ]);
    } catch (e) {}
    const qrSrc = await vcMakeQr(window.buildVcardText(d), 600);
    const qrImg = new Image();
    await new Promise((res, rej) => { qrImg.onload = res; qrImg.onerror = rej; qrImg.src = qrSrc; });

    const iconOk = document.fonts.check('400 18px "Material Symbols Outlined"', 'call');
    const serif = (w, s) => `${w} ${s}px "Bodoni Moda", serif`;
    const body = (w, s) => `${w} ${s}px "Hanken Grotesk", sans-serif`;

    const W = 860, M = 40, PAD = 46, SCALE = 2;
    const cardW = W - M * 2;
    const innerW = cardW - PAD * 2;

    const lines = [];
    if (d.phone) lines.push(['call', d.phone]);
    if (d.location) lines.push(['location_on', d.location]);
    if (d.website) lines.push(['language', d.website]);
    if (d.email) lines.push(['mail', d.email]);
    const pills = [d.instagram && 'Instagram', d.tiktok && 'TikTok', d.facebook && 'Facebook'].filter(Boolean);

    let ch = PAD + 34 + 16;
    if (d.name) ch += 42;
    if (d.role) ch += 22;
    ch += 22 + 24 + lines.length * 30;
    if (pills.length) ch += 18 + 34;
    ch += PAD;
    const qrBoxW = 400, qrBoxH = 406;
    const H = M + ch + 28 + qrBoxH + M;

    const c = document.createElement('canvas');
    c.width = W * SCALE;
    c.height = H * SCALE;
    const ctx = c.getContext('2d');
    ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';

    ctx.fillStyle = '#fbf9f8';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#000000';
    vcRR(ctx, M, M, cardW, ch, 24);
    ctx.fill();

    let y = M + PAD;
    const cx = M + PAD;

    ctx.fillStyle = '#ffffff';
    ctx.font = serif(600, 30);
    ctx.fillText('Zoskales', cx, y + 28);
    if (iconOk && document.fonts.check('400 26px "Material Symbols Outlined"', 'diamond')) {
      ctx.font = '400 26px "Material Symbols Outlined"';
      ctx.textAlign = 'right';
      ctx.fillStyle = '#ffdea5';
      ctx.fillText('diamond', M + cardW - PAD, y + 26);
      ctx.textAlign = 'left';
    }
    y += 34 + 16;

    if (d.name) {
      ctx.font = serif(600, 36);
      ctx.fillStyle = '#ffffff';
      let nm = d.name;
      if (ctx.measureText(nm).width > innerW) {
        while (nm.length > 1 && ctx.measureText(nm + '…').width > innerW) nm = nm.slice(0, -1);
        nm += '…';
      }
      ctx.fillText(nm, cx, y + 34);
      y += 42;
    }
    if (d.role) {
      ctx.font = body(600, 12);
      ctx.letterSpacing = '0.15em';
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      const role = d.role.toUpperCase();
      ctx.fillText(role.length > 48 ? role.slice(0, 48) + '…' : role, cx, y + 14);
      ctx.letterSpacing = '0px';
      y += 22;
    }
    ctx.font = body(400, 12);
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText('Zoskales Diamonds', cx, y + 12);
    y += 22 + 12;

    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx, y);
    ctx.lineTo(cx + innerW, y);
    ctx.stroke();
    y += 12;

    lines.forEach(([icon, txt]) => {
      const ty = y + 20;
      if (iconOk) {
        ctx.font = '400 18px "Material Symbols Outlined"';
        ctx.fillStyle = '#ffdea5';
        ctx.fillText(icon, cx, ty);
      }
      ctx.font = body(400, 15);
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      const tx = cx + (iconOk ? 28 : 0);
      const maxW = cx + innerW - tx;
      let s = String(txt);
      if (ctx.measureText(s).width > maxW) {
        while (s.length > 1 && ctx.measureText(s + '…').width > maxW) s = s.slice(0, -1);
        s += '…';
      }
      ctx.fillText(s, tx, ty);
      y += 30;
    });

    if (pills.length) {
      y += 18;
      let px = cx;
      ctx.font = body(500, 11);
      pills.forEach((label) => {
        const pw = ctx.measureText(label).width + 28;
        if (px + pw > cx + innerW) return;
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        vcRR(ctx, px, y, pw, 32, 16);
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.fillText(label, px + 14, y + 21);
        px += pw + 10;
      });
    }

    const qbx = (W - qrBoxW) / 2, qby = M + ch + 28;
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#e9e8e7';
    vcRR(ctx, qbx, qby, qrBoxW, qrBoxH, 20);
    ctx.fill();
    ctx.stroke();
    ctx.drawImage(qrImg, (W - 300) / 2, qby + 28, 300, 300);
    ctx.textAlign = 'center';
    ctx.font = body(600, 13);
    ctx.fillStyle = '#1b1c1c';
    ctx.fillText('Scan to save contact', W / 2, qby + 344);
    ctx.font = body(400, 13);
    ctx.fillStyle = '#747878';
    ctx.fillText(vcUrl, W / 2, qby + 378);
    ctx.textAlign = 'left';

    const blob = await new Promise((res) => c.toBlob(res, 'image/png'));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'zoskales-vcard.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    btn.textContent = 'Downloaded ✓';
  } catch (err) {
    btn.textContent = 'Failed — retry';
  }
  btn.disabled = false;
  setTimeout(() => { btn.textContent = 'Download QR'; }, 1800);
}

        </div>
      </div>
      <div class="space-y-6">
        <div class="p-6 rounded-2xl bg-surface-container-lowest shadow-sm">
          <h3 class="serif text-xl mb-4">Preview</h3>
          <div id="vc-preview"></div>
        </div>
        <div class="p-6 rounded-2xl bg-surface-container-lowest shadow-sm">
          <h3 class="serif text-xl">QR Code</h3>
          <p class="text-xs text-on-surface-variant mt-1 mb-4">Scanning opens the phone's default contact-saving page with these details.</p>
          <div class="flex flex-wrap items-start gap-5">
            <div class="p-3 bg-white rounded-xl border border-surface-container-high">
              <img id="vc-qr" alt="vCard QR code" class="w-40 h-40 hidden" />
              <div id="vc-qr-loading" class="w-40 h-40 flex items-center justify-center text-xs text-on-surface-variant">Generating…</div>
            </div>
            <div class="space-y-3 text-sm min-w-40">
              <div class="text-[10px] uppercase tracking-widest text-on-surface-variant">Card link</div>
              <div class="px-3 py-2 rounded-lg bg-surface-container text-xs break-all">${escapeHtml(vcUrl)}</div>
              <button id="vc-download" class="px-5 py-2.5 rounded-full border border-primary text-primary text-xs uppercase tracking-widest hover:bg-primary hover:text-on-primary transition-all">Download QR</button>
            </div>
          </div>
        </div>
      </div>
    </div>`;

  const refreshPreview = () => {
    const el = document.getElementById('vc-preview');
    if (el) el.innerHTML = vcardPreviewHtml(readVcardForm());
  };
  refreshPreview();

  const refreshQr = async () => {
    if (!window.buildVcardText) {
      await new Promise((res) => document.addEventListener('qr-ready', res, { once: true }));
    }
    const text = window.buildVcardText(readVcardForm());
    try {
      const dataUrl = await vcMakeQr(text);
      const qr = document.getElementById('vc-qr');
      if (!qr) return;
      qr.src = dataUrl;
      qr.classList.remove('hidden');
      document.getElementById('vc-qr-loading').classList.add('hidden');
    } catch {
      const l = document.getElementById('vc-qr-loading');
      if (l) l.textContent = 'QR unavailable';
    }
  };
  refreshQr();
  VCARD_FIELDS.forEach(f => {
    document.getElementById('vc-' + f.key).addEventListener('input', () => { refreshPreview(); refreshQr(); });
  });

  document.getElementById('vc-download').onclick = vcDownloadCard;

  document.getElementById('vc-save').onclick = async () => {
    const btn = document.getElementById('vc-save');
    const status = document.getElementById('vc-status');
    const data = readVcardForm();
    if (!data.name) {
      status.className = 'text-sm text-red-600';
      status.textContent = 'Contact person name is required.';
      return;
    }
    btn.disabled = true;
    status.className = 'text-sm text-on-surface-variant';
    status.textContent = 'Saving…';
    try {
      for (const f of VCARD_FIELDS) {
        await api('/content', { method: 'PUT', body: { section: 'vcard', key: f.key, value: data[f.key] } });
      }
      status.className = 'text-sm text-green-600';
      status.textContent = 'Saved ✓';
      refreshPreview();
    } catch (err) {
      status.className = 'text-sm text-red-600';
      status.textContent = 'Save failed: ' + err.message;
    }
    btn.disabled = false;
  };
}

render();
</script>
<script type="module">
  import QRCode from 'qrcode';
  import { buildVcard as buildVcardText } from './lib/vcard.js';
  window.QRCode = QRCode;
  window.buildVcardText = buildVcardText;
  document.dispatchEvent(new Event('qr-ready'));
</script>
</body>
</html>
